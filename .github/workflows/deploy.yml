name: Build and deploy

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

# The CMS commits on every save, so a burst of edits should not queue up a
# build per keystroke - cancel superseded runs, but never a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build
        # Project pages serve at /<repo>/, so root-absolute URLs need the
        # prefix. The build step skips it automatically when a CNAME is
        # present, since a custom domain serves at the root.
        run: npm run build
        env:
          PATH_PREFIX: /alexiux-site

      - name: Fail if the build produced no pages
        run: |
          count=$(find _site -name '*.html' | wc -l)
          echo "Built $count HTML pages."
          if [ "$count" -lt 12 ]; then
            echo "::error::Expected at least 12 pages, got $count."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
